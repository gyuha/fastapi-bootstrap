# ============================================================
# e2e-smoke.yml — End-to-End Smoke Test CI 워크플로우
# ============================================================
#
# 트리거:
#   - main / master 브랜치 push
#   - main / master 브랜치 대상 PR
#
# Job 구성 (순차 실행):
#   ① template-validation : scripts/gen_and_validate.sh
#       → 전체 시나리오(default/no-chat/oauth-variants 등)로
#         생성 구조·파일 내용을 assert
#
#   ② compose-smoke        : scripts/validate_compose.sh
#       → cookiecutter로 프로젝트 생성
#       → docker compose up -d (postgres + redis + mailpit)
#       → 헬스체크 폴링 → healthy 도달 확인 → 컨테이너 정리
#
# 캐시 전략:
#   - Docker layer cache  : /tmp/.docker-layer-cache (infra 이미지 tar)
#                           key: docker-infra-<os>-<compose-hash>
#   - uv cache            : astral-sh/setup-uv@v4 (enable-cache: true)
#   - pip cache           : actions/setup-python@v5 (cache: pip)
#
# 스코프 외 (Seed constraints):
#   - Dockerfile push pipeline
#   - background job queue (arq/celery)
#   - 생성된 프로젝트 내부 CI 파일
# ============================================================

name: E2E Smoke Test

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# 동일 ref에 대해 실행 중인 워크플로우를 취소하고 최신 것만 유지
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── 워크플로우 전역 환경 변수 ──────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================
  # Job ①: 템플릿 구조 검증
  # scripts/gen_and_validate.sh
  #   → 전체 시나리오(5개 JSON)를 순서대로 실행하여
  #     생성된 파일 구조·내용이 기대와 일치하는지 assert
  # ============================================================
  template-validation:
    name: "① Template Validation (gen_and_validate.sh)"
    runs-on: ubuntu-latest

    steps:
      # ── 소스 체크아웃 ────────────────────────────────────────────────────────
      - name: "Checkout repository"
        uses: actions/checkout@v4

      # ── Python 설정 (pip 캐시 포함) ────────────────────────────────────────
      - name: "Set up Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ── uv 설치 (uv 캐시 활성화) ───────────────────────────────────────────
      # validate_template.py / gen_and_validate.sh 내부에서 uvx 폴백 경로로 사용됨
      - name: "Install uv (with cache)"
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-suffix: "template-validation"

      # ── cookiecutter 설치 ──────────────────────────────────────────────────
      # gen_and_validate.sh 가 Python API 경로로 실행할 수 있도록
      - name: "Install cookiecutter"
        run: pip install "cookiecutter>=2.1"

      # ── jq 버전 확인 (ubuntu-latest 기본 포함) ─────────────────────────────
      - name: "Verify jq is available"
        run: jq --version

      # ── Dockerfile 멀티스테이지 빌드 구조 정적 검증 (Sub-AC 3.1) ────────────
      # Docker 없이 Dockerfile 텍스트를 파싱하여 COPY --from 레이어 범위 검증:
      #   • uv-binary / builder / runtime 3스테이지 존재
      #   • runtime이 builder의 /runtime-venv + alembic 만 복사
      #   • uv/uvx 바이너리 · build-essential · gcc 등이 runtime에 없음
      #   • --no-group dev 로 /runtime-venv 생성 확인
      - name: "Validate Dockerfile multi-stage build structure (static analysis)"
        run: python scripts/validate_dockerfile_structure.py

      # ── 템플릿 검증 실행 ────────────────────────────────────────────────────
      - name: "Run template validation (scripts/gen_and_validate.sh)"
        run: bash scripts/gen_and_validate.sh

  # ============================================================
  # Job ②: 프로덕션 Docker 이미지 검증 (Sub-AC 3.2 + 3.3)
  # scripts/validate_prod_image.sh
  #   → cookiecutter로 기본 시나리오 프로젝트 생성
  #   → docker build --target runtime (슬림 프로덕션 이미지)
  #   → 검사 A: dev Python 패키지 absent (pytest, ruff, mypy 등)
  #   → 검사 B: 런타임 Python 패키지 present (fastapi, uvicorn 등)
  #   → 검사 C: 런타임 진입점 확인 (uvicorn, alembic)
  #   → 검사 D: 시스템 도구 absent — docker run으로 not found 반환 확인
  #             uv, uvx, pip, pip3, gcc, g++, make, git + 바이너리 경로 + Python 헤더
  #   → 검사 E: 최종 이미지 크기 임계값 검증 (Sub-AC 3.3)
  #             MAX_IMAGE_SIZE_MB 이하인지 강제 검증 (초과 시 빌드 실패)
  #             기본값: 600 MB (auth+chat 기본 시나리오)
  #             정책 문서: docs/docker-image-size-policy.md
  # ============================================================
  prod-image-validation:
    name: "② Prod Image — Dev Tool Absent + Size Validation (Sub-AC 3.2/3.3)"
    runs-on: ubuntu-latest
    needs: template-validation   # Job ① 통과 후에만 실행

    env:
      # 이미지 크기 임계값 (MB) — Sub-AC 3.3
      # 기본 시나리오 (include_chat_domain=yes 포함)는 langchain/litellm로 인해
      # auth-only 보다 크므로 600 MB 를 CI 기본값으로 설정.
      # auth 전용 프로젝트: 350, auth+chat: 600
      # 로컬 재정의: MAX_IMAGE_SIZE_MB=350 bash scripts/validate_prod_image.sh
      MAX_IMAGE_SIZE_MB: "600"

    steps:
      # ── 소스 체크아웃 ────────────────────────────────────────────────────────
      - name: "Checkout repository"
        uses: actions/checkout@v4

      # ── Python 설정 (cookiecutter 설치용) ─────────────────────────────────
      - name: "Set up Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ── cookiecutter 설치 ──────────────────────────────────────────────────
      - name: "Install cookiecutter"
        run: pip install "cookiecutter>=2.1"

      # ── Docker Buildx 설정 (BuildKit 레이어 캐시 지원) ─────────────────────
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      # ── Docker 레이어 캐시 복원 (런타임 이미지 빌드 속도 향상) ────────────
      # 키: 템플릿 Dockerfile + pyproject.toml 해시
      # 의존성이나 Dockerfile이 바뀌면 캐시를 자동 무효화하여 새로 빌드.
      - name: "Restore Docker layer cache (runtime image)"
        uses: actions/cache@v4
        id: runtime-image-cache
        with:
          path: /tmp/.runtime-image-cache
          key: runtime-image-${{ runner.os }}-${{ hashFiles('**/Dockerfile', '**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            runtime-image-${{ runner.os }}-

      # ── validate_prod_image.sh 실행 ───────────────────────────────────────
      # 스크립트 내부 동작 (순서):
      #   1. cookiecutter로 default_all_features 시나리오 프로젝트 생성
      #   2. docker build --target runtime (슬림 프로덕션 이미지 빌드)
      #   3. 검사 A — dev Python 패키지 absent
      #      (pytest, pytest-asyncio, ruff, mypy, pre-commit, fakeredis 등)
      #   4. 검사 B — 런타임 Python 패키지 present
      #      (fastapi, uvicorn, SQLAlchemy, alembic, passlib, argon2-cffi 등)
      #   5. 검사 C — 런타임 진입점
      #      (uvicorn --version, alembic --version)
      #   6. 검사 D — 시스템 도구 absent (Sub-AC 3.2 핵심)
      #      docker run --rm <IMAGE> sh -c "command -v <tool>" 로 not found 검증
      #      대상 명령어: uv, uvx, pip, pip3, gcc, g++, cc, make, git, cargo, npm, node
      #      대상 경로:   /usr/local/bin/uv, /usr/local/bin/uvx, /usr/bin/gcc 등
      #      Python 헤더: /usr/include/python3* (python3-dev 부재 확인)
      #      libpq 헤더:  /usr/include/libpq-fe.h (libpq-dev 부재 확인)
      #   7. 검사 E — 최종 이미지 크기 임계값 검증 (Sub-AC 3.3)
      #      docker image inspect --format='{{.Size}}' 로 바이트 단위 크기 측정
      #      MAX_IMAGE_SIZE_MB (= ${{ env.MAX_IMAGE_SIZE_MB }} MB) 초과 시 빌드 실패
      #      정책 문서: docs/docker-image-size-policy.md
      - name: "Validate prod image — dev tool absent + size limit (scripts/validate_prod_image.sh)"
        run: |
          bash scripts/validate_prod_image.sh \
            --max-size-mb "$MAX_IMAGE_SIZE_MB"
        timeout-minutes: 20

  # ============================================================
  # Job ③: Docker Compose E2E 스모크 테스트
  # scripts/validate_compose.sh
  #   → cookiecutter로 프로젝트 생성
  #   → docker compose up -d (postgres:16-alpine, redis:7-alpine, mailpit)
  #   → healthcheck 폴링 → healthy 도달 확인
  #   → 컨테이너·임시 디렉터리 정리 (EXIT trap)
  # ============================================================
  compose-smoke:
    name: "③ Docker Compose Smoke Test (validate_compose.sh)"
    runs-on: ubuntu-latest
    needs: template-validation   # Job ① 통과 후에만 실행 (compose는 image 빌드 불필요)

    steps:
      # ── 소스 체크아웃 ────────────────────────────────────────────────────────
      - name: "Checkout repository"
        uses: actions/checkout@v4

      # ── Python 설정 (pip 캐시 포함) ────────────────────────────────────────
      - name: "Set up Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ── uv 설치 (uv 캐시 활성화) ───────────────────────────────────────────
      - name: "Install uv (with cache)"
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-suffix: "compose-smoke"

      # ── cookiecutter 설치 ──────────────────────────────────────────────────
      - name: "Install cookiecutter"
        run: pip install "cookiecutter>=2.1"

      # ── Docker Buildx 설정 (BuildKit 레이어 캐시 지원) ─────────────────────
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      # ── Docker 이미지 레이어 캐시 복원 ────────────────────────────────────
      # 인프라 이미지(postgres:16-alpine, redis:7-alpine, axllent/mailpit:latest)를
      # tar 아카이브로 캐싱하여 매 실행 시 Docker Hub 풀을 생략.
      # 키: docker-compose.yml 해시 기반 → 서비스 이미지 변경 시 자동 무효화
      - name: "Restore Docker image layer cache"
        uses: actions/cache@v4
        id: docker-layer-cache
        with:
          path: /tmp/.docker-layer-cache
          key: docker-infra-${{ runner.os }}-${{ hashFiles('**/docker-compose.yml') }}
          restore-keys: |
            docker-infra-${{ runner.os }}-

      # ── 캐시에서 Docker 이미지 로드 ────────────────────────────────────────
      - name: "Load Docker images from cache (if available)"
        if: steps.docker-layer-cache.outputs.cache-hit == 'true'
        run: |
          CACHE_TAR="/tmp/.docker-layer-cache/infra-images.tar"
          if [ -f "${CACHE_TAR}" ]; then
            echo "캐시된 Docker 이미지 로딩 중..."
            docker load -i "${CACHE_TAR}" \
              && echo "✅ Docker 이미지 캐시에서 로드 완료" \
              || echo "⚠️  캐시 로드 실패 — Docker Hub에서 새로 pull합니다"
          else
            echo "⚠️  캐시 파일 없음: ${CACHE_TAR}"
          fi

      # ── E2E 스모크 테스트 실행 ─────────────────────────────────────────────
      # validate_compose.sh 내부 동작:
      #   1. cookiecutter로 기본 시나리오(default_all_features.json) 프로젝트 생성
      #   2. .env.example → .env 복사
      #   3. docker compose up -d (postgres + redis + mailpit)
      #   4. 각 서비스 healthcheck 폴링 (최대 120초)
      #   5. 종료 시 자동 정리 (EXIT trap)
      - name: "Run docker-compose e2e smoke test (scripts/validate_compose.sh)"
        run: bash scripts/validate_compose.sh --timeout 120

      # ── Docker 이미지를 캐시로 저장 ────────────────────────────────────────
      # 다음 실행에서 캐시 히트 가능하도록 인프라 이미지를 tar로 저장.
      # 테스트 성공/실패 무관하게 항상 실행 (if: always()).
      - name: "Save Docker images to layer cache"
        if: always()
        run: |
          mkdir -p /tmp/.docker-layer-cache
          CACHE_TAR="/tmp/.docker-layer-cache/infra-images.tar"

          # 로컬에 존재하는 인프라 이미지 목록 수집
          IMAGES=""
          for img in "postgres:16-alpine" "redis:7-alpine" "axllent/mailpit:latest"; do
            if docker image inspect "$img" > /dev/null 2>&1; then
              IMAGES="${IMAGES} ${img}"
            else
              echo "⚠️  이미지 없음 (저장 건너뜀): ${img}"
            fi
          done

          if [ -n "${IMAGES}" ]; then
            echo "Docker 이미지 캐시 저장 중:${IMAGES}"
            # shellcheck disable=SC2086
            docker save ${IMAGES} -o "${CACHE_TAR}" \
              && echo "✅ Docker 이미지 캐시 저장 완료: ${CACHE_TAR}" \
              || echo "⚠️  Docker 이미지 캐시 저장 실패 (비치명적)"
          else
            echo "⚠️  캐시할 인프라 이미지를 찾을 수 없습니다"
          fi
