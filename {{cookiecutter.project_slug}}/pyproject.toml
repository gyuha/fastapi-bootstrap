[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "{{ cookiecutter.package_name }}"
version = "0.1.0"
description = "{{ cookiecutter.project_description }}"
readme = "README.md"
license = { text = "{{ cookiecutter.license }}" }
authors = [
    { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" },
]
requires-python = ">={{ cookiecutter.python_version }}"

dependencies = [
    # ── Web framework ─────────────────────────────────────────────────────
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # ── Validation / Settings ─────────────────────────────────────────────
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # ── Database ─────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",          # Async PostgreSQL driver

    # ── Auth / Security ───────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",   # JWT encode/decode
    "passlib[argon2]>=1.7.4",             # Password hashing (argon2 backend)
    "argon2-cffi>=23.1.0",                # Argon2 C extension

    # ── Cache / Pub-Sub ───────────────────────────────────────────────────
    "redis[hiredis]>=5.2.0",

    # ── HTTP Client (OAuth flows) ─────────────────────────────────────────
    "httpx>=0.27.0",

    # ── Email ─────────────────────────────────────────────────────────────
    "fastapi-mail>=1.4.2",

    # ── Observability ─────────────────────────────────────────────────────
    "structlog>=24.4.0",

    # ── Streaming ─────────────────────────────────────────────────────────
    "sse-starlette>=2.1.0",
    {% if cookiecutter.include_chat_domain == "yes" %}
    # ── LLM / Chat domain ─────────────────────────────────────────────────
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-litellm>=0.2.0",
    "litellm>=1.50.0",
    {% endif %}
]

# ---------------------------------------------------------------------------
# Dependency groups (PEP 735 — uv-native, not published to PyPI)
# ---------------------------------------------------------------------------
# Install with: uv sync  (dev is included by default via tool.uv.default-groups)
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.6.0",           # async test helpers
    "httpx>=0.27.0",          # AsyncClient for TestClient
    "fakeredis>=2.26.0",      # In-memory Redis stub for tests
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    # Type stubs
    "sqlalchemy[mypy]>=2.0.36",
    "types-passlib>=1.7.7",
    "types-python-jose>=3.3.0",
]

# ---------------------------------------------------------------------------
# uv settings
# ---------------------------------------------------------------------------
[tool.uv]
# Include the 'dev' dependency-group by default in all uv sync invocations
default-groups = ["dev"]

[tool.uv.sources]
# Pin sources here if you use a private PyPI mirror, e.g.:
# fastapi = { index = "pypi" }

# ---------------------------------------------------------------------------
# Hatchling build (src layout)
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.package_name }}"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "alembic/",
    "alembic.ini",
    "pyproject.toml",
    "README.md",
]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py{{ cookiecutter.python_version | replace('.', '') }}"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations (type hints)
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
]
ignore = [
    "ANN101", # missing type annotation for self
    "ANN102", # missing type annotation for cls
    "S101",   # use of assert (allowed in tests)
    "B008",   # do not perform function calls in defaults (FastAPI DI pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "T20"]
"alembic/**" = ["ANN", "N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Mypy — static type checker
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "{{ cookiecutter.python_version }}"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

# Disable noisy strict rules for prototype iteration
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "fastapi_mail.*",
    "passlib.*",
    "jose.*",
    "alembic.*",
    "redis.*",
    {% if cookiecutter.include_chat_domain == "yes" %}
    "langchain.*",
    "langchain_community.*",
    "langchain_litellm.*",
    "litellm.*",
    {% endif %}
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
addopts = [
    "--strict-markers",
    "--cov=src/{{ cookiecutter.package_name }}",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=70",
]
markers = [
    "unit: pure unit tests (no I/O)",
    "integration: tests that hit DB / Redis",
    "e2e: end-to-end tests against the running server",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/{{ cookiecutter.package_name }}"]
branch = true
omit = [
    "*/migrations/*",
    "*/alembic/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
